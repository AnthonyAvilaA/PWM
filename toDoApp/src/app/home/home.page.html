<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Argony
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">News</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-list>
      <ion-item *ngFor="let item of news | async" [routerLink]="'/news/' + item.ID" class="news-item">
        <ion-thumbnail slot="start" class="news-thumbnail">
          <img src="{{ item.image }}" alt="News Image">
        </ion-thumbnail>
        <ion-label>
          <h2 class="news-title">{{ item.title }}</h2>
          <p class="news-description">{{ item.description }}</p>
          <p class="news-date">{{ getDate(item.createdAt) }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
