<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Pagina de registro - Argony News</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <main>
            <h1>Registro</h1>
            <div class="main-container">
                <form (ngSubmit)="register()" class="page-form">
                    <div *ngIf="errorMessage" class="error-message">
                        {{ errorMessage }}
                    </div>

                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-item">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" [(ngModel)]="password" required>
                    </div>

                    <div class="form-item">
                        <label for="re-password">Confirmar Contraseña</label>
                        <input type="password" id="re-password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
                    </div>

                    <div class="form-item">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" [(ngModel)]="username" required>
                    </div>

                    <div class="form-item">
                        <label for="name">Nombre (opcional)</label>
                        <input type="text" id="name" name="name" [(ngModel)]="name">
                    </div>

                    <button type="submit" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Registrarse</span>
                        <span *ngIf="isLoading">Cargando...</span>
                    </button>
                </form>
                <p>
                    ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesion</a>
                </p>
            </div>
        </main>
    </body>
</html>
