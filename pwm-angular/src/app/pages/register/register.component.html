<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Pagina de registro - Argony News</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <main>
            <h1>Registro</h1>
            <div class="main-container">
                <form action="#" method="post" class="page-form">
                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-item">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-item">
                        <label for="re-password">Confirmar Contraseña</label>
                        <input type="password" id="re-password" name="re-password" required>
                    </div>

                    <div class="form-item">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <button type="submit">Registrarse</button>
                </form>
                <p>
                    ¿Ya tienes cuenta? <!--Falta imlementar el codigo para llevar a la pagina de registro-->
                </p>
            </div>
        </main>
    </body>
</html>
