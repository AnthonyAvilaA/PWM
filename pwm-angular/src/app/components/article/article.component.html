<article class="news-article" *ngIf="news" [routerLink]="['/news', news.ID]" tabindex="0">
  <div class="text-content">
    <h1 class="title">{{ news.title }}</h1>
    <p class="extract">{{ news.description }}</p>
    <span class="read-more">Leer más</span>
  </div>
  <figure class="image-container">
    <img [src]="news.image" alt="Imagen de {{ news.title }}">
    <figcaption class="caption">{{ news.updatedAt | date:'short' }}</figcaption>
  </figure>
</article>
