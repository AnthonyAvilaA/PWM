<a [routerLink]="[link]" class="live-headline">
  <span class="live-dot">
    <span class="circle"></span>
    <span class="ringring"></span>
  </span>
  <span *ngIf="liveNews && liveNews.title">{{ liveNews.title }}</span>
  <span *ngIf="!liveNews">Noticias en vivo - Sigue los acontecimientos más recientes</span>
</a>
