<article class="side-article stacked" *ngIf="news">
    <figure class="image-container">
        <img [src]="news.image" alt="Imagen de {{ news.title }}">
    </figure>
    <div class="text-content">
        <h2 class="title">{{ news.title }}</h2>
        <p class="extract">{{ news.description }}</p>
        <a [routerLink]="['/news', news.ID]" class="read-more">Leer más</a>
    </div>
</article>
